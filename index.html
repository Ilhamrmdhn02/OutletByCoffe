<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Outlet by Coffee — Aplikasi Kasir</title>
<meta name="description" content="Aplikasi kasir Outlet by Coffee Surabaya: POS, denah meja, master menu, riwayat transaksi, laporan penjualan, dan jejak audit.">
<meta name="theme-color" content="#f6f5f1">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
    :root {
        --paper: #07100c;
        --ink: #eef3ee;
        --muted: #9aa8a0;
        --accent: #3ea87f;
        --line: #1e2b24;
    }
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
        background: var(--paper);
        color: var(--ink);
        font-family: Inter, system-ui, -apple-system, 'Segoe UI', sans-serif;
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
    }
    iframe {
        display: block;
        width: 100%;
        height: 100%;
        border: 0;
        background: #f6f5f1;
    }
    .dock {
        position: fixed;
        right: 16px;
        bottom: 16px;
        z-index: 10;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 7px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: #0c1a13f2;
        box-shadow: 0 10px 28px #00000059;
        backdrop-filter: blur(10px);
    }
    .dock a, .dock button {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        border: 0;
        border-radius: 999px;
        padding: 8px 14px;
        font: inherit;
        font-size: 12px;
        font-weight: 600;
        line-height: 1.2;
        text-decoration: none;
        cursor: pointer;
        white-space: nowrap;
    }
    .dock-primary { background: var(--accent); color: #06130d; }
    .dock-primary:hover { background: #4fbd93; }
    .dock-ghost { background: transparent; color: var(--muted); }
    .dock-ghost:hover { color: var(--ink); background: #ffffff0f; }
    .dock-dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--accent);
    }
    .dock-dot[data-state="offline"] { background: #d97706; }
    .dock-dot[data-state="unknown"] { background: #5b6b62; }

    .offline {
        position: fixed;
        inset: 0;
        z-index: 20;
        display: none;
        place-items: center;
        padding: 24px;
        background: radial-gradient(120% 100% at 50% 0%, #10241a 0%, #07100c 65%);
    }
    .offline[data-open="true"] { display: grid; }
    .offline-card {
        width: min(430px, 100%);
        border: 1px solid var(--line);
        border-radius: 18px;
        padding: 30px 26px;
        text-align: center;
        background: #0c1a13;
        box-shadow: 0 30px 70px #00000066;
    }
    .offline-card img { width: 52px; height: 52px; }
    .offline-card h1 {
        margin: 16px 0 8px;
        font-size: 19px;
        font-weight: 700;
        letter-spacing: -0.02em;
    }
    .offline-card p {
        margin: 0 0 20px;
        font-size: 13px;
        line-height: 1.6;
        color: var(--muted);
    }
    .offline-card .row { display: grid; gap: 9px; }
    .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 12px 18px;
        border: 1px solid var(--line);
        border-radius: 11px;
        font: inherit;
        font-size: 13px;
        font-weight: 600;
        color: var(--ink);
        background: #12241b;
        text-decoration: none;
        cursor: pointer;
    }
    .btn:hover { background: #172e22; }
    .btn-solid { border-color: transparent; background: var(--accent); color: #06130d; }
    .btn-solid:hover { background: #4fbd93; }

    @media (max-width: 520px) {
        .dock { right: 10px; bottom: 10px; left: 10px; justify-content: space-between; }
        .dock a, .dock button { padding: 8px 11px; font-size: 11.5px; }
    }
    @media print {
        .dock, .offline { display: none !important; }
    }
</style>
</head>
<body>

<iframe id="app" src="https://script.google.com/macros/s/AKfycbzCR4PUjhriWdsfYowb70irxrMtUPqlt9nXcdYWYNwYwMLA13s_8YElQoR_9NPxmDFY1A/exec"
        title="Aplikasi kasir Outlet by Coffee" allow="clipboard-write"></iframe>

<div class="dock">
    <span class="dock-dot" id="conn-dot" data-state="unknown" aria-hidden="true"></span>
    <a class="dock-primary" href="demo.html">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12m0 0 4-4m-4 4-4-4M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>
        Buka demo offline
    </a>
    <button class="dock-ghost" type="button" id="install-btn" hidden>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="6" y="2" width="12" height="20" rx="3"/><path d="M11 18h2"/></svg>
        <span>Pasang</span>
    </button>
</div>

<div class="offline" id="offline" role="dialog" aria-modal="true" aria-labelledby="offline-title">
    <div class="offline-card">
        <img src="icon.svg" alt="" width="52" height="52">
        <h1 id="offline-title">Koneksi terputus</h1>
        <p id="offline-desc">Aplikasi kasir butuh internet karena data disimpan di Google Sheets. Untuk demo tanpa jaringan, pakai versi offline dengan data contoh.</p>
        <div class="row">
            <a class="btn btn-solid" href="demo.html">Buka demo offline</a>
            <button class="btn" type="button" id="retry-btn">Coba sambung ulang</button>
        </div>
    </div>
</div>

<script>
(function () {
    var dot = document.getElementById('conn-dot');
    var panel = document.getElementById('offline');
    var desc = document.getElementById('offline-desc');

    function paint() {
        var online = navigator.onLine;
        dot.setAttribute('data-state', online ? 'online' : 'offline');
        dot.title = online ? 'Terhubung' : 'Tidak ada koneksi';
        panel.setAttribute('data-open', String(!online));
    }

    window.addEventListener('online', paint);
    window.addEventListener('offline', paint);
    paint();

    document.getElementById('retry-btn').addEventListener('click', function () {
        if (navigator.onLine) {
            location.reload();
            return;
        }
        desc.textContent = 'Masih belum ada koneksi. Periksa Wi-Fi atau data seluler, lalu coba lagi.';
    });

    if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
            navigator.serviceWorker.register('sw.js').catch(function () {});
        });
    }

    var deferredPrompt = null;
    var installBtn = document.getElementById('install-btn');
    window.addEventListener('beforeinstallprompt', function (event) {
        event.preventDefault();
        deferredPrompt = event;
        installBtn.hidden = false;
    });
    installBtn.addEventListener('click', function () {
        if (!deferredPrompt) return;
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then(function () {
            deferredPrompt = null;
            installBtn.hidden = true;
        });
    });
    window.addEventListener('appinstalled', function () {
        installBtn.hidden = true;
    });
})();
</script>
</body>
</html>
